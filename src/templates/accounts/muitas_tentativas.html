{% load static static_versionado %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muitas tentativas</title>
    <link rel="stylesheet" href="{% static_v 'css/base.css' %}">
    <link rel="stylesheet" href="{% static_v 'css/cadastro-style.css' %}">
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
</head>
<body>
    <div class="caixa-login">
        <div class="barra-topo">
            <a href="{% url 'accounts:login' %}">&larr;</a>
            <p>Muitas tentativas</p>
        </div>
        <div class="mensagem-status mensagem-status-erro">
            <h1>Espere um pouco</h1>
            <p>Detectamos muitas tentativas a partir da sua conexão. Aguarde
            alguns minutos e tente novamente.</p>
        </div>
        <a href="{% url 'accounts:login' %}">Voltar para o login</a>
    </div>
</body>
</html>
