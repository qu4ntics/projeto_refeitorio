{% autoescape on %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f0;padding:24px 0;font-family:'Segoe UI',system-ui,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #e7e7df;border-radius:12px;padding:32px;">
        <tr>
          <td style="font-size:18px;font-weight:700;color:#1a1a2e;padding-bottom:8px;">
            ReservaIF
          </td>
        </tr>
        <tr>
          <td style="font-size:14px;color:#444;line-height:1.6;padding-bottom:20px;">
            Olá, {{ usuario.first_name|default:usuario.username }}. Use o código
            abaixo para confirmar seu e-mail e ativar sua conta.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:8px 0 20px;">
            <div style="display:inline-block;font-size:32px;font-weight:800;letter-spacing:8px;color:#00b05b;background:#f0faf4;border:1px solid #cdeeda;border-radius:10px;padding:14px 22px;">
              {{ codigo }}
            </div>
          </td>
        </tr>
        <tr>
          <td style="font-size:12px;color:#999;line-height:1.6;">
            O código expira em 15 minutos. Se você não fez esse cadastro, ignore
            este e-mail.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
{% endautoescape %}
